worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain application/json application/javascript text/css;

  # Rate limiting zone
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  server {
    listen 80;
    server_name jfi.jymyxliftsservices.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name jfi.jymyxliftsservices.com;

    ssl_certificate     /etc/letsencrypt/live/jfi.jymyxliftsservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jfi.jymyxliftsservices.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://jfi.jymyxliftsservices.com" always;

    # Serve investor PWA static files
    root /var/www/jfi/investor;
    index index.html;

    # PWA — all routes fall back to index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # API proxy to Fastify
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass         http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Stricter rate limit on auth endpoints
    location /api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass         http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
    }

    # WebSocket proxy
    location /ws {
      proxy_pass          http://127.0.0.1:3000;
      proxy_http_version  1.1;
      proxy_set_header    Upgrade    $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_set_header    Host       $host;
      proxy_read_timeout  3600s;
    }
  }

  # Admin PWA on subdomain
  server {
    listen 443 ssl http2;
    server_name admin.jfi.jymyxliftsservices.com;

    ssl_certificate     /etc/letsencrypt/live/jfi.jymyxliftsservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jfi.jymyxliftsservices.com/privkey.pem;

    root /var/www/jfi/admin;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass         http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
    }
  }
}